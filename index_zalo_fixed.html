<head>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#050a11; touch-action:none; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:grid; place-items:center; overflow:hidden; background:radial-gradient(ellipse at center,#142437 0%,#050a11 72%); }
  canvas { display:block; width:min(100vw,177.7778dvh); height:auto; max-height:100dvh; aspect-ratio:16/9; touch-action:none; user-select:none; -webkit-user-select:none; }
  #stage:fullscreen, #stage:-webkit-full-screen { width:100%; height:100%; inset:0; }
  #stage:fullscreen canvas, #stage:-webkit-full-screen canvas { width:min(100vw,177.7778dvh); height:auto; max-height:100dvh; }
  #stage:fullscreen #hint, #stage:-webkit-full-screen #hint { bottom:max(8px,env(safe-area-inset-bottom)); }
  @media (orientation:portrait) {
    #stage { display:block; width:100vw; height:100vh; height:100dvh; height:100svh; }
    canvas {
      position:absolute; left:50%; top:50%;
      /* Sau khi xoay 90 độ, cạnh ngang của canvas phải vừa đúng chiều rộng màn hình.
         Giới hạn cả hai chiều để không bị cắt trên trình duyệt nhúng của Zalo. */
      width:min(100dvh, 177.7778vw);
      height:min(56.25dvh, 100vw);
      max-width:none; max-height:none; aspect-ratio:auto;
      transform:translate(-50%,-50%) rotate(90deg); transform-origin:center center;
    }
  }
  #hint { position:fixed; left:50%; bottom:max(6px,env(safe-area-inset-bottom)); transform:translateX(-50%); color:#9db1c5; font-size:10px; letter-spacing:.08em; opacity:.72; pointer-events:none; white-space:nowrap; }
</style>
</head>

<div id="stage"><canvas id="game" width="960" height="540" aria-label="Game Đoàn Xe Tận Thế"></canvas><div id="hint">CHẠM CÁC NÚT TRONG KHUNG GAME • GIỮ ◀ ▶ ĐỂ DI CHUYỂN • GIỮ BẮN ĐỂ KHAI HỎA</div></div>
<script>
(()=>{
'use strict';

const W=960,H=540;
const C={ink:'#07101a',panel:'#101d2b',panel2:'#17283a',line:'#31495f',muted:'#93a9bd',text:'#f1f6fb',cyan:'#63e2e8',green:'#9ce66e',gold:'#ffd36e',red:'#ff6f70',orange:'#ff9d5c'};
const weapons=[
 {name:'LIÊN THANH',short:'MG',desc:'Bắn nhanh, ổn định',cost:0,rate:.24,damage:13,speed:650,color:'#ffe08a',kind:'bullet'},
 {name:'SHOTGUN',short:'SG',desc:'Chùm đạn tầm gần',cost:180,rate:.82,damage:8,speed:570,color:'#ffb36c',kind:'spread'},
 {name:'SÚNG PHUN LỬA',short:'FL',desc:'Thiêu đốt nhiều mục tiêu',cost:260,rate:.11,damage:3.8,speed:390,color:'#ff784e',kind:'flame'},
 {name:'PHÁO NẶNG',short:'RG',desc:'Đạn nổ sát thương lớn',cost:420,rate:1.35,damage:58,speed:420,color:'#ff6f70',kind:'rocket'},
 {name:'SÚNG ĐIỆN',short:'EL',desc:'Phóng điện lan mục tiêu',cost:540,rate:.92,damage:25,speed:900,color:'#91d7ff',kind:'electric'}
];
const vehicleDefs=[

 {id:'tank',name:'XE BỌC THÉP',desc:'Giáp dày, chịu đòn tốt',hp:150,speed:154,defense:2,unlockAt:10,starCost:8,body:'#53645d',accent:'#a47a42',cabin:'#596e68'},
 {id:'heavy',name:'SIÊU XA TẢI',desc:'Máu lớn, khung cực chắc',hp:190,speed:136,defense:4,unlockAt:20,starCost:18,body:'#5d5549',accent:'#8c6844',cabin:'#6b6254'}
];
const chapters=[
 {name:'ĐƯỜNG VÀNH ĐAI',sub:'Rời khỏi vùng ngoại ô',color:'#65d8d0'},
 {name:'THÀNH PHỐ CHẾT',sub:'Xuyên qua tâm dịch',color:'#ffad66'},
 {name:'CẢNG ĐỎ',sub:'Chuyến tàu cuối cùng',color:'#e77983'}
];
const missions=[
 ['Trạm thu phí','Cầu vượt gãy','Khu dân cư','Bãi xe bỏ hoang','Đường hầm tối','Trạm xăng','Cánh đồng cháy','Cầu sắt','Kho tiếp tế','Cổng thoát hiểm'],
 ['Đại lộ đổ nát','Ga điện ngầm','Quảng trường','Bệnh viện cũ','Khu thương mại','Nhà máy điện','Phố ngập','Tháp kiểm soát','Vành đai đỏ','Trung tâm chỉ huy'],
 ['Bến container','Cầu cảng','Nhà máy đóng tàu','Kho nhiên liệu','Kênh dẫn','Cầu nâng','Bãi tàu','Hải đăng','Tường chắn','Con tàu cuối']
];
const defaultSave={playerName:'Người sống sót',totalCoinsEarned:0,stageRecords:{},coins:360,unlocked:0,stars:Array.from({length:3},()=>Array(10).fill(0)),owned:[0],slots:[0,0,0],upgrades:{power:0,armor:0,engine:0,reload:0},weaponRanks:[0,0,0,0,0],weaponFragments:[0,0,0,0,0],boxes:{basic:0,elite:0},vehicle:'scout',vehiclesOwned:['scout'],starTokens:0,vehicleUpgrades:{scout:{armor:0,engine:0,plating:0},tank:{armor:0,engine:0,plating:0},heavy:{armor:0,engine:0,plating:0}},bestKills:0,totalKills:0,achievements:{},openedCrates:0};
let save=loadSave(),mode='title',chapter=0,level=0,selectedSlot=0,selectedChapter=0,selectedLevel=0,shopTab='weapons',notice='',noticeTimer=0,achPage=0,leaderPage=0;
let player={x:185,hp:100,maxHp:100,move:0},enemies=[],boss=null,bossSpawned=false,bullets=[],particles=[],floating=[],spawned=0,kills=0,quota=0,elapsed=0,spawnTimer=0,missionTime=58,fireHeld=false,moveDir=0,activeSlot=0,pausedFrom='playing',resultStars=0,stageReward=0,shake=0,ui=[];
let last=performance.now(),anim=0,lootModal=null,boxReveal=null,targetMode='zombies',bossDeathFx=0;
function cloneDefault(){return JSON.parse(JSON.stringify(defaultSave))}
if(!localStorage.getItem('zconvoy_name_prompted')){setTimeout(()=>{const n=prompt('Đặt tên người chơi trong Zombie Convoy:','Người sống sót');if(n&&n.trim()){save.playerName=n.trim().slice(0,18);store();}localStorage.setItem('zconvoy_name_prompted','1');},250);}
function loadSave(){
 try{
  let x=JSON.parse(localStorage.getItem('zconvoy_save')||'null');if(!x)return cloneDefault();
  const base=cloneDefault(),stars=x.stars||base.stars;
  const totalStars=stars.flat().reduce((a,b)=>a+(Number(b)||0),0);
  const out={...base,...x,playerName:x.playerName||base.playerName,totalCoinsEarned:x.totalCoinsEarned||0,stageRecords:x.stageRecords||{},upgrades:{...base.upgrades,...(x.upgrades||{})},stars,slots:x.slots||[0,null,null],owned:x.owned||[0],boxes:{...base.boxes,...(x.boxes||{})},achievements:{...(x.achievements||{})},openedCrates:x.openedCrates||0,totalKills:x.totalKills||0,weaponRanks:Array.from({length:5},(_,i)=>(x.weaponRanks||[])[i]||0),weaponFragments:Array.from({length:5},(_,i)=>(x.weaponFragments||[])[i]||0),vehiclesOwned:x.vehiclesOwned||['scout'],vehicle:x.vehicle||'scout',starTokens:x.starTokens==null?totalStars:x.starTokens,vehicleUpgrades:{...base.vehicleUpgrades}};
  for(const v of vehicleDefs)out.vehicleUpgrades[v.id]={...base.vehicleUpgrades[v.id],...((x.vehicleUpgrades||{})[v.id]||{})};
  if(!out.vehiclesOwned.includes('scout'))out.vehiclesOwned.unshift('scout');
  if(!vehicleDefs.some(v=>v.id===out.vehicle))out.vehicle='scout';
  return out;
 }catch(e){return cloneDefault()}
}
function store(){try{localStorage.setItem('zconvoy_save',JSON.stringify(save));}catch(e){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function getVehicle(){return vehicleDefs.find(v=>v.id===save.vehicle)||vehicleDefs[0]}
function getVehicleUpgrade(){return save.vehicleUpgrades[save.vehicle]||{armor:0,engine:0,plating:0}}
function isBossStage(){return (chapter*10+level+1)%5===0}
function weaponRank(i){return save.weaponRanks[i]||0}
function fragmentNeed(i){return 20+weaponRank(i)*10}
function achievementDefs(){
 const defs=[];
 const add=(id,name,desc,reward,ok,box=0)=>defs.push({id,name,desc,reward,box,ok});
 [[10,80],[25,140],[50,220],[100,350],[250,550],[500,800],[1000,1200],[2500,1800],[5000,2600],[10000,4000]].forEach(([n,r])=>add('kills_'+n,'THỢ SĂN '+n,'Tiêu diệt tổng cộng '+n+' zombie',r,()=>save.totalKills>=n,n>=1000?1:0));
 [[500,100],[1500,180],[3000,280],[5000,420],[10000,650],[25000,1000],[50000,1600],[100000,2500]].forEach(([n,r])=>add('coins_'+n,'TAY CÀY '+n,'Kiếm tổng cộng '+n+' xu từ nhiệm vụ, zombie và phần thưởng',r,()=>save.totalCoinsEarned>=n,n>=25000?1:0));
 [[1,120],[5,300],[10,550],[15,800],[20,1100],[25,1500],[30,2200]].forEach(([n,r])=>add('stages_'+n,'CHINH PHỤC '+n+' ẢI','Hoàn thành tổng cộng '+n+' ải khác nhau',r,()=>Object.values(save.stageRecords||{}).filter(v=>v&&v.completed).length>=n,n>=20?1:0));
 add('first_boss','KẺ SĂN TRÙM','Hạ gục boss lần đầu',450,()=>!!save.achievements.first_bossDone,1);
 return defs;
}
function addCoins(n){n=Math.max(0,Math.floor(n||0));save.coins+=n;save.totalCoinsEarned=(save.totalCoinsEarned||0)+n;return n;}
function checkAchievements(){for(const a of achievementDefs()){if(!save.achievements[a.id]&&a.ok()){save.achievements[a.id]=true;addCoins(a.reward);if(a.box)save.boxes.elite=(save.boxes.elite||0)+a.box;toast('THÀNH TỰU: '+a.name+' • +'+a.reward+' xu'+(a.box?' + hộp cao cấp':''));}}store()}
function rr(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function txt(s,x,y,size=16,color=C.text,weight=600,align='left'){ctx.font=`${weight} ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(String(s),x,y)}
function line(x1,y1,x2,y2,color=C.line,w=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function circle(x,y,r,fill,stroke=null,w=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=w;ctx.strokeStyle=stroke;ctx.stroke()}}
function button(id,x,y,w,h,label,fn,opt={}){const disabled=!!opt.disabled;rr(x,y,w,h,opt.r||12,disabled?'#172330':(opt.fill||'#20364a'),disabled?'#2b3d4c':(opt.stroke||'#49657c'),1);if(opt.glow&&!disabled){ctx.save();ctx.shadowColor=opt.glow;ctx.shadowBlur=14;rr(x,y,w,h,opt.r||12,null,opt.glow,1);ctx.restore()}if(opt.icon)txt(opt.icon,x+20,y+h/2,opt.size||18,opt.color||C.text,800,'center');txt(label,x+(opt.icon?39:w/2),y+h/2,opt.size||14,disabled?'#607488':(opt.color||C.text),800,opt.icon?'left':'center');if(!disabled)ui.push({id,x,y,w,h,fn});}
function addHit(id,x,y,w,h,fn){ui.push({id,x,y,w,h,fn})}
function drawBg(t=0){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101e31');g.addColorStop(.56,'#233247');g.addColorStop(.57,'#222c36');g.addColorStop(1,'#111a23');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // moon / smoky glow
 const glow=ctx.createRadialGradient(760,115,8,760,115,200);glow.addColorStop(0,'rgba(255,181,125,.18)');glow.addColorStop(1,'rgba(255,181,125,0)');ctx.fillStyle=glow;ctx.fillRect(540,0,420,330);circle(760,105,28,'#d9d4c1');circle(773,98,29,'#18283a');
 // skyline
 for(let i=0;i<19;i++){let x=i*58-((t*12)%58),w=35+(i*17%24),h=95+(i*47%130);ctx.fillStyle=i%3===0?'#1a2938':'#1b2a39';ctx.fillRect(x,300-h,w,h);ctx.fillStyle='rgba(255,203,130,.18)';for(let yy=315-h;yy<292;yy+=23)for(let xx=x+8;xx<x+w-4;xx+=14)if(((xx+yy+i)%4)<2)ctx.fillRect(xx,yy,5,8);}
 // distant giant boss silhouette on milestone stages (10 / 20 / 30)
 if(mode==='playing'&&[10,20,30].includes(chapter*10+level+1)){ctx.save();ctx.globalAlpha=.26;let bx=760,by=285;circle(bx,by-110,76,'#52645a','#91a08a',5);rr(bx-82,by-75,164,170,35,'#46584f','#87947c',4);line(bx-65,by-25,bx-125,by+65,'#52645a',28);line(bx+65,by-25,bx+130,by+70,'#52645a',28);circle(bx-25,by-115,9,'#e65e59');circle(bx+25,by-115,9,'#e65e59');ctx.restore();}
 // road / ground
 ctx.fillStyle='#161e27';ctx.fillRect(0,385,W,155);ctx.fillStyle='#2d3640';ctx.fillRect(0,385,W,8);ctx.fillStyle='#77818a';ctx.fillRect(0,393,W,2);for(let i=0;i<8;i++){let x=(i*160-(t*75)%160);ctx.fillStyle='#9b9b8e';ctx.fillRect(x,466,72,5);}ctx.fillStyle='#29323b';ctx.fillRect(0,510,W,30);
 // debris
 for(let i=0;i<9;i++){let x=((i*131-(t*26)%1080)+1080)%1080-40;ctx.fillStyle='#303b45';ctx.beginPath();ctx.moveTo(x,390);ctx.lineTo(x+20,376+(i%3)*5);ctx.lineTo(x+42,390);ctx.fill();}
}
function drawZombie(e){let x=e.x,y=e.y,s=e.size;ctx.save();ctx.translate(x,y);if(e.type==='brute')s*=1.3;if(e.hit>0){ctx.globalAlpha=.65+Math.sin(anim*35)*.25}let skin=e.type==='spitter'?'#8cae75':e.type==='brute'?'#7c8b70':'#9aa883';
 // shadow
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,20*s,17*s,5*s,0,0,Math.PI*2);ctx.fill();
 // legs
 ctx.strokeStyle='#4d5e50';ctx.lineWidth=7*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5*s,8*s);ctx.lineTo(-10*s,22*s);ctx.moveTo(6*s,8*s);ctx.lineTo(12*s,22*s);ctx.stroke();
 // body
 rr(-11*s,-12*s,22*s,29*s,7*s,skin,'#52634f',1);ctx.strokeStyle=skin;ctx.lineWidth=6*s;ctx.beginPath();ctx.moveTo(-9*s,-6*s);ctx.lineTo(-18*s,5*s);ctx.moveTo(9*s,-5*s);ctx.lineTo(18*s,4*s);ctx.stroke();
 // head
 circle(0,-20*s,10*s,skin,'#52634f',1);circle(-4*s,-21*s,2.2*s,'#ff6961');circle(4*s,-21*s,2.2*s,'#ff6961');line(-3*s,-14*s,4*s,-13*s,'#3d4b40',1.5);
 if(e.type==='spitter'){circle(0,-5*s,3*s,'#a6d96d')}if(e.type==='brute'){rr(-17*s,-31*s,34*s,12*s,5*s,'#56635b');}
 ctx.restore();
}
function drawCar(x,y,scale=1,preview=false,vehicleId=null){const v=vehicleDefs.find(q=>q.id===(vehicleId||save.vehicle))||vehicleDefs[0];ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(95,54,153,17,0,0,Math.PI*2);ctx.fill();
 // wheels
 for(let wx of [15,75,155,215]){circle(wx,42,17,'#111820','#64717a',3);circle(wx,42,7,'#77838b');circle(wx,42,2,'#c0c6c9')}
 // chassis
 rr(-15,8,255,35,10,v.body,'#9babb5',2);rr(-8,0,240,23,7,v.accent,'#df9670',1);rr(0,15,225,16,4,'#253648');
 // cabin
 ctx.beginPath();ctx.moveTo(42,5);ctx.lineTo(59,-27);ctx.lineTo(158,-27);ctx.lineTo(184,5);ctx.closePath();ctx.fillStyle=v.cabin;ctx.fill();ctx.strokeStyle='#b4c2c9';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#9fd0d5';ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(66,-22);ctx.lineTo(105,-22);ctx.lineTo(105,1);ctx.lineTo(52,1);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(113,-22);ctx.lineTo(152,-22);ctx.lineTo(173,1);ctx.lineTo(113,1);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
 // armor plating
 rr(-4,7,28,12,3,'#d1a15d','#ffe0a1',1);rr(183,8,42,12,3,'#253442','#82929d',1);circle(232,13,5,'#ffcf69');
  if(v.id==='tank'){rr(10,-4,28,17,4,'#778477','#c3c9a0',1);rr(178,-5,42,15,4,'#68786b','#c3c9a0',1);}
  if(v.id==='heavy'){rr(-10,-9,42,18,4,'#786b51','#c2a878',1);rr(174,-10,52,22,4,'#786b51','#c2a878',1);rr(56,-31,100,8,3,'#8d7958','#d1bc91',1);}
 // three weapon decks / turrets
 for(let i=0;i<3;i++){let tx=65+i*65,ty=-34;rr(tx-18,ty+4,38,13,4,i===activeSlot&&!preview?'#d38c44':'#5a6d7d','#b5c4cb',1);rr(tx-8,ty-3,23,10,4,'#758b9a','#d9e0e2',1);rr(tx+7,ty-1,27,4,2,'#d4dce0');circle(tx-1,ty+8,3,'#202c35');}
 // beacon
 circle(24,-5,5,'#f05f5a');circle(24,-5,2,'#ffe3ae');
 ctx.restore();
 // labels and hit areas not drawn here
}
function drawSlotMarkers(carX=330,carY=355,scale=1.15){for(let i=0;i<3;i++){let x=carX+(65+i*65)*scale,y=carY-34*scale;let active=i===activeSlot;rr(x-19,y-13,41,25,7,active?'#254b56':'#142536',active?C.cyan:'#516a7c',1.5);txt(save.slots[i]===null?'＋':weapons[save.slots[i]].short,x+1,y,11,active?C.cyan:'#e1e9ee',900,'center');addHit('slot'+i,x-22,y-17,47,34,()=>{selectedSlot=i;activeSlot=i;if(mode==='playing'){notice=weapons[save.slots[i]??0].name+' • TẦNG '+(i+1);noticeTimer=1.1}else if(mode==='garage'){shopTab='weapons';}});}}
function toggleFullscreen(){const el=document.getElementById('stage');const active=!!(document.fullscreenElement||document.webkitFullscreenElement);if(active){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit){const p=exit.call(document);if(p&&p.catch)p.catch(()=>{});}return;}const req=el.requestFullscreen||el.webkitRequestFullscreen;if(req){let p;try{p=req.call(el,{navigationUI:'hide'});}catch(e){try{p=req.call(el);}catch(err){p=null;}}if(p&&p.then){p.then(()=>{try{screen.orientation?.lock?.('landscape').catch(()=>{});}catch(e){}toast('Đã bật toàn màn hình. Chạm ⛶ để thu nhỏ.');}).catch(()=>toast('Trình duyệt không cho phép toàn màn hình. Dùng menu ⋮ > Thêm vào màn hình chính để chơi không có thanh địa chỉ.'));}else if(p===undefined){try{screen.orientation?.lock?.('landscape').catch(()=>{});}catch(e){} }else toast('Không bật được toàn màn hình. Hãy thử menu ⋮ > Thêm vào màn hình chính.');}else toast('Trình duyệt chưa hỗ trợ toàn màn hình. Dùng menu ⋮ > Thêm vào màn hình chính để ẩn thanh địa chỉ.');}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){try{screen.orientation?.unlock?.();}catch(e){}}});
document.addEventListener('webkitfullscreenchange',()=>{if(!document.webkitFullscreenElement){try{screen.orientation?.unlock?.();}catch(e){}}});

function draw(){ui=[];if(mode==='title')drawTitle();else if(mode==='settings')drawSettings();else if(mode==='leaderboard')drawLeaderboard();else if(mode==='changelog')drawChangelog();else if(mode==='chapters')drawChapters();else if(mode==='levels')drawLevels();else if(mode==='garage')drawGarage();else if(mode==='vehicles')drawVehicles();else if(mode==='achievements')drawAchievements();else if(mode==='shop')drawShop();else if(mode==='upgrades')drawUpgrades();else if(mode==='playing')drawPlaying();else if(mode==='paused')drawPaused();else if(mode==='result')drawResult();if(lootModal||boxReveal)drawLootOverlay();}
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;anim+=dt;if(mode==='playing'&&!lootModal&&!boxReveal)updateGame(dt);if(noticeTimer>0)noticeTimer-=dt;draw();requestAnimationFrame(frame)}
function pointerPos(e){let r=canvas.getBoundingClientRect(),u=(e.clientX-r.left)/r.width,v=(e.clientY-r.top)/r.height;let x,y;if(matchMedia('(orientation: portrait)').matches){ // canvas rotated 90deg clockwise in portrait
 x=v*W;y=(1-u)*H;
 }else{x=u*W;y=v*H;}return {x,y};}
function dispatch(x,y){for(let i=ui.length-1;i>=0;i--){let h=ui[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return true;}}return false;}
let activePointer=null;
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);activePointer=e.pointerId;let p=pointerPos(e);dispatch(p.x,p.y);});
canvas.addEventListener('pointerup',e=>{if(activePointer!==e.pointerId)return;activePointer=null;moveDir=0;fireHeld=false;});
canvas.addEventListener('pointercancel',()=>{activePointer=null;moveDir=0;fireHeld=false;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')moveDir=-1;if(e.key==='ArrowRight'||e.key==='d')moveDir=1;if(e.key===' '||e.key==='Enter')fireHeld=true;if(e.key==='Escape'&&mode==='playing'){mode='paused';fireHeld=false;moveDir=0;}if(e.key==='1'||e.key==='2'||e.key==='3')activeSlot=Number(e.key)-1;});
window.addEventListener('keyup',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))moveDir=0;if(e.key===' '||e.key==='Enter')fireHeld=false;});
// reset held controls if app loses focus
document.addEventListener('visibilitychange',()=>{if(document.hidden){moveDir=0;fireHeld=false;if(mode==='playing')mode='paused';}});
requestAnimationFrame(frame);
})();
