(()=>{'use strict';

const C={text:'#f1f6fb',muted:'#93a9bd',cyan:'#63e2e8',green:'#9ce66e',gold:'#ffd36e',red:'#ff6f70',orange:'#ff9d5c',panel:'#101d2b',line:'#40586d'};

];

const guns=weapons.map(w=>({ammo:w.mag,heat:0,reload:0,hot:0,cool:0}));
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function isBossLevel(){return(chapter*10+level+1)%5===0}function currentGun(){return save.slots[activeSlot]??0}function toast(s){notice=s;noticeTime=2}
function rr(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function txt(s,x,y,size=14,color=C.text,weight=600,align='left'){ctx.font=`${weight} ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(String(s),x,y)}
function line(x1,y1,x2,y2,color=C.line,w=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function circle(x,y,r,fill,stroke=null,w=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=w;ctx.strokeStyle=stroke;ctx.stroke()}}
function button(id,x,y,w,h,label,fn,opt={}){rr(x,y,w,h,opt.r||10,opt.fill||'#20364a',opt.stroke||'#49657c',1);txt(label,x+w/2,y+h/2,opt.size||12,opt.color||C.text,800,'center');ui.push({id,x,y,w,h,fn})}
function bg(t=0){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101e31');g.addColorStop(.55,'#26384c');g.addColorStop(.56,'#252e37');g.addColorStop(1,'#111a23');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const glow=ctx.createRadialGradient(760,115,8,760,115,210);glow.addColorStop(0,'rgba(255,181,125,.18)');glow.addColorStop(1,'rgba(255,181,125,0)');ctx.fillStyle=glow;ctx.fillRect(540,0,420,330);
 // Wide, layered landscape and long road create a larger-scale map impression.
 for(let i=0;i<18;i++){let x=i*66-((t*10)%66),h=90+(i*53%145),w=43+(i*19%29);ctx.fillStyle=i%3?'#1b2a39':'#243144';ctx.fillRect(x,300-h,w,h);for(let yy=315-h;yy<290;yy+=24)for(let xx=x+8;xx<x+w-5;xx+=15)if((xx+yy+i)%3) {ctx.fillStyle='rgba(255,203,130,.18)';ctx.fillRect(xx,yy,5,8)}}
 ctx.fillStyle='#161e27';ctx.fillRect(0,380,W,160);ctx.fillStyle='#3b4650';ctx.fillRect(0,380,W,7);ctx.fillStyle='#77818a';ctx.fillRect(0,389,W,2);roadOffset=(roadOffset+t*92)%210;ctx.fillStyle='#8c969d';for(let i=-1;i<7;i++)ctx.fillRect(i*210-roadOffset,465,92,6);ctx.fillStyle='#303b45';for(let i=0;i<8;i++){let x=(i*133-(t*25)%1080+1080)%1080-40;ctx.beginPath();ctx.moveTo(x,390);ctx.lineTo(x+23,375+i%3*5);ctx.lineTo(x+48,390);ctx.fill()}}
function drawCar(x,y,scale=.76){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(100,50,145,17,0,0,Math.PI*2);ctx.fill();for(const wx of [15,75,155,215]){circle(wx,40,16,'#111820','#64717a',3);circle(wx,40,6,'#77838b')}rr(-15,8,255,34,10,'#53645d','#9babb5',2);rr(-8,0,240,23,7,'#a47a42','#df9670',1);rr(0,14,225,15,4,'#253648');ctx.beginPath();ctx.moveTo(42,5);ctx.lineTo(59,-27);ctx.lineTo(158,-27);ctx.lineTo(184,5);ctx.closePath();ctx.fillStyle='#596e68';ctx.fill();ctx.strokeStyle='#b4c2c9';ctx.lineWidth=2;ctx.stroke();rr(55,-22,50,22,3,'#9fd0d5');rr(114,-22,49,22,3,'#9fd0d5');for(let i=0;i<3;i++){let tx=65+i*65;rr(tx-18,-30,38,14,4,i===activeSlot?'#d38c44':'#5a6d7d','#b5c4cb',1);rr(tx+4,-28,28,4,2,guns[save.slots[i]??0]?.hot>0?'#ff394f':'#d4dce0')}circle(24,-5,5,'#f05f5a');ctx.restore()}
function drawZombie(e){ctx.save();ctx.translate(e.x,e.y);if(e.type==='brute')ctx.scale(1.38,1.38);if(e.type==='runner')ctx.scale(.8,.8);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,20,19,5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4d5e50';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5,7);ctx.lineTo(-10,22);ctx.moveTo(6,7);ctx.lineTo(12,22);ctx.stroke();rr(-11,-12,22,29,7,e.def.color,'#52634f');line(-9,-5,-19,7,e.def.color,6);line(9,-5,18,4,e.def.color,6);circle(0,-20,10,e.def.color,'#52634f');circle(-4,-21,2,'#ff6961');circle(4,-21,2,'#ff6961');if(e.type==='spitter')circle(0,-5,4,'#b4e56d');if(e.type==='brute')rr(-17,-31,34,12,5,'#56635b');if(e.hp<e.maxHp){rr(-18,-39,36,4,2,'#24313b');rr(-18,-39,36*clamp(e.hp/e.maxHp,0,1),4,2,C.green)}ctx.restore()}
function addZombie(){let roll=Math.random(),type=roll<.46?'walker':roll<.64?'runner':roll<.82?'spitter':'brute';if(kills+zombies.length===quota-1&&level===9)type='brute';let d=enemiesDef[type],difficulty=1+(chapter*10+level)*.055;zombies.push({x:990+Math.random()*180,y:310+Math.random()*85,type,def:d,hp:Math.round(d.hp*difficulty),maxHp:Math.round(d.hp*difficulty),speed:d.speed*(1+(chapter*10+level)*.012),attack:1+Math.random()})}
function startMission(){quota=12+level*2+chapter*4;kills=0;elapsed=0;zombies=[];shots=[];particles=[];boss=null;player.x=155;player.maxHp=100;player.hp=100;fireSeconds=0;for(let i=0;i<guns.length;i++){guns[i]={ammo:weapons[i].mag,heat:0,reload:0,hot:0,cool:0}}mode='playing';toast('Giữ nút bắn để tăng nhịp bắn sau 6 giây!')}
function spawnBoss(){let d=bossDefs[(chapter+Math.floor(level/5))%bossDefs.length],scale=1+(chapter*10+level)*.045;boss={...d,x:835,y:335,hp:Math.round(d.hp*scale),maxHp:Math.round(d.hp*scale),cooldown:2.1,warning:0,attackCount:0,hit:0};toast('BOSS XUẤT HIỆN: '+boss.name+'!')}
function target(){let possible=zombies.filter(z=>z.x>player.x+40).sort((a,b)=>a.x-b.x);return boss||possible[0]||null}
function hurt(e,damage){e.hp-=damage;e.hit=.12;if(e.hp<=0){if(e===boss){boss=null;save.coins+=250+chapter*100;toast('Hạ boss! Thưởng xu đã cộng.')}else{zombies=zombies.filter(z=>z!==e);kills++;save.totalKills=(save.totalKills||0)+1;save.coins+=e.type==='brute'?15:6}}}
function shoot(){let wi=currentGun(),w=weapons[wi],g=guns[wi];if(g.cool>0||g.hot>0)return;if(g.heat>=100){g.heat=100;g.hot=1.35;toast(w.name+' QUÁ NÓNG — CHỜ 1,35 GIÂY');return}if(g.ammo<=0){g.reload=wi===3?2.2:wi===1?1.55:1.35;toast(w.name+' ĐANG THAY ĐẠN');return}let t=target();if(!t)return;let speedBoost=fireSeconds>=6?Math.min(.38,(fireSeconds-6)*.045):0;g.cool=Math.max(.055,w.rate*(1-speedBoost));g.ammo--;g.heat=Math.min(100,g.heat+w.heat*(1+speedBoost*1.6));if(g.heat>=100)g.hot=1.35;let sx=player.x+108,sy=343,dx=t.x-sx,dy=t.y-sy,dist=Math.hypot(dx,dy)||1,damage=w.damage*(1+(fireSeconds>=6?.08:0));if(w.kind==='flame'){zombies.filter(z=>z.x>sx&&z.x<sx+340&&Math.abs(z.y-sy)<85).forEach(z=>hurt(z,damage));if(boss&&boss.x>sx)hurt(boss,damage)}else if(w.kind==='electric'){let near=[...zombies,...(boss?[boss]:[])].filter(e=>Math.hypot(e.x-t.x,e.y-t.y)<155).sort((a,b)=>Math.hypot(a.x-t.x,a.y-t.y)-Math.hypot(b.x-t.x,b.y-t.y)).slice(0,4);near.forEach((e,i)=>hurt(e,damage*(i?0.58:1)));}else if(w.kind==='spread'){for(let n=0;n<5;n++){let a=Math.atan2(dy,dx)+(n-2)*.12;shots.push({x:sx,y:sy,vx:Math.cos(a)*w.speed,vy:Math.sin(a)*w.speed,damage:damage*.56,life:.72,kind:'pellet',color:w.color})}}else shots.push({x:sx,y:sy,vx:dx/dist*w.speed,vy:dy/dist*w.speed,damage,life:w.kind==='rocket'?1.7:1.4,kind:w.kind,color:w.color,blast:w.kind==='rocket'?105:0});particles.push({x:sx,y:sy,life:.16,max:.16,color:w.color})}
function switchSlot(i){if(i===activeSlot)return;activeSlot=i;const g=guns[save.slots[i]??0];g.reload=Math.max(g.reload,.55);g.cool=Math.max(g.cool,.55);toast('Đổi súng: thay đạn/ổn định trong 0,55 giây')}
function update(dt){elapsed+=dt;let wi=currentGun();fireSeconds=fireHeld?fireSeconds+dt:0;for(let i=0;i<guns.length;i++){let g=guns[i];g.cool=Math.max(0,g.cool-dt);g.hot=Math.max(0,g.hot-dt);if(g.hot===0)g.heat=Math.max(0,g.heat-dt*7);g.reload=Math.max(0,g.reload-dt);if(g.reload===0&&g.ammo===0)g.ammo=weapons[i].mag}player.x=clamp(player.x+moveDir*180*dt,65,475);if(fireHeld)shoot();if(kills<quota&&Math.random()<dt*(.7+chapter*.14))addZombie();for(let z of zombies){z.x-=z.speed*dt;if(z.x<player.x+195){z.attack-=dt;if(z.attack<=0){player.hp-=z.def.damage;z.attack=z.type==='brute'?1.2:.9;}}}if(kills>=quota&&zombies.length===0&&isBossLevel()&&!boss)spawnBoss();if(boss){boss.hit=Math.max(0,boss.hit-dt);boss.cooldown-=dt;if(boss.cooldown<=0&&!boss.warning){boss.warning=1.05;boss.attackCount++;boss.cooldown=4.2;toast('BOSS: '+boss.attack+' — NÉ ĐÒN!')}if(boss.warning>0){boss.warning-=dt;if(boss.warning<=0){if(boss.attackCount%3===0){boss.x=clamp(player.x+160,280,840);if(Math.abs(boss.x-player.x)<255)player.hp-=boss.damage*1.2;boss.x=835}else if(boss.attackCount%3===2){player.hp-=boss.damage*.55;particles.push({x:player.x+170,y:405,life:.35,max:.35,color:C.green})}else if(Math.abs(boss.x-(player.x+110))<145)player.hp-=boss.damage;}}}
 for(let b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let targetList=[...zombies,...(boss?[boss]:[])],hit=targetList.find(e=>Math.hypot(e.x-b.x,e.y-b.y)<(e===boss?54:24));if(hit){if(b.kind==='rocket'){targetList.filter(e=>Math.hypot(e.x-hit.x,e.y-hit.y)<b.blast).forEach(e=>hurt(e,e===hit?b.damage:b.damage*.48))}else hurt(hit,b.damage);b.life=0;particles.push({x:b.x,y:b.y,life:.3,max:.3,color:b.color})}}shots=shots.filter(b=>b.life>0&&b.x<1000&&b.x>0);particles.forEach(p=>p.life-=dt);particles=particles.filter(p=>p.life>0);if(player.hp<=0){finish(false);return}if(kills>=quota&&zombies.length===0&&(!isBossLevel()||!boss)){finish(true)}}
function finish(won){fireHeld=false;keys.fire=false;resultWon=won;if(won){save.coins+=120+chapter*45+level*18;let key=chapter*10+level;save.bestStars[key]=Math.max(save.bestStars[key]||0,player.hp/player.maxHp>.75?3:player.hp/player.maxHp>.45?2:1);save.unlocked=Math.max(save.unlocked,Math.min(29,key+1));}store();mode='result'}
function rouletteCost(){return 250+(Number(save.rolls)||0)*175}function prize(){let item=sectors[roulette.prize];if(item.type==='coins'){save.coins+=item.value;roulette.result='Nhận '+item.value+' xu!'}else if(item.type==='frag'){let i=Math.floor(Math.random()*weapons.length);save.weaponFragments[i]=(save.weaponFragments[i]||0)+item.value;roulette.result='Nhận '+item.value+' mảnh '+weapons[i].name+'!'}else{save.boxes[item.value]=(save.boxes[item.value]||0)+1;roulette.result='Nhận '+(item.value==='basic'?'hộp tiếp tế':'hộp cao cấp')+'!'}store()}
function roll(){if(roulette.spinning)return;let cost=rouletteCost();if(save.coins<cost){toast('Không đủ xu quay!');return}save.coins-=cost;save.rolls=(Number(save.rolls)||0)+1;roulette.prize=Math.floor(Math.random()*12);roulette.result='';roulette.start=roulette.angle;let step=2*Math.PI/12;roulette.target=roulette.start+Math.PI*2*7+((-Math.PI/2-(roulette.prize+.5)*step-roulette.start)%(Math.PI*2));roulette.elapsed=0;roulette.spinning=true;store()}
function updateRoulette(dt){if(!roulette.spinning)return;roulette.elapsed=Math.min(1.5,roulette.elapsed+dt);let t=roulette.elapsed/1.5,ease=1-Math.pow(1-t,3);roulette.angle=roulette.start+(roulette.target-roulette.start)*ease;if(t>=1){roulette.spinning=false;prize()}}
function header(title,sub){rr(18,14,924,58,14,'rgba(7,16,26,.88)',C.line);txt(title,38,35,20,C.text,900);txt(sub,40,56,10,C.muted,600);txt('◈ '+save.coins,875,42,14,C.gold,900,'right')}

 for(let b of shots){ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=b.kind==='rocket'?22:12;if(b.kind==='rocket'){line(b.x,b.y,b.x-b.vx*.06,b.y-b.vy*.06,'#ff9b55',7);circle(b.x,b.y,7,'#fff0c2')}else circle(b.x,b.y,b.kind==='pellet'?3:4,b.color);ctx.restore()}particles.forEach(p=>circle(p.x,p.y,7*p.life/p.max,p.color));rr(17,13,926,62,12,'rgba(5,14,23,.88)',C.line);txt(`CHƯƠNG ${chapter+1} • ẢI ${level+1}${isBossLevel()?' • BOSS':''}`,32,30,12,C.cyan,900);txt(`ZOMBIE ${kills}/${quota}`,340,30,13,C.text,900);rr(340,48,180,9,4,'#293746');rr(340,48,180*kills/quota,9,4,C.green);txt(`XE ${Math.max(0,Math.ceil(player.hp))}/${player.maxHp} HP`,535,48,11,player.hp<30?C.red:C.green,900);for(let i=0;i<3;i++){let x=22+i*101,wi=save.slots[i]??0,active=i===activeSlot;rr(x,88,94,43,8,active?'#254752':'#182b3b',active?C.cyan:C.line,1.5);circle(x+14,109,8,weapons[wi].color);txt(weapons[wi].short,x+31,109,10,C.text,900);txt(''+guns[wi].ammo,x+76,109,9,C.gold,800,'center');ui.push({id:'switch'+i,x,y:88,w:94,h:43,fn:()=>switchSlot(i)})}let wi=currentGun(),w=weapons[wi],g=guns[wi],heatColor=g.hot>0?'#ff394f':g.heat>65?C.orange:C.green;rr(22,139,287,36,8,'rgba(5,13,22,.92)',C.line);txt(g.hot>0?'QUÁ NÓNG '+g.hot.toFixed(1)+'s':g.reload>0?'ĐANG THAY ĐẠN':`${w.name}  •  ĐẠN ${g.ammo}/${w.mag}`,31,151,9,heatColor,900);rr(31,163,264,7,4,'#293746');rr(31,163,264*g.heat/100,7,4,heatColor);txt(fireSeconds>=6?'BẮN NHANH + NÓNG NHANH':'Giữ bắn 6 giây để tăng tốc độ',163,184,9,fireSeconds>=6?C.gold:C.muted,700,'center');button('pause',854,24,76,34,'Ⅱ DỪNG',()=>{mode='paused';fireHeld=false;keys.fire=false},{fill:'#34485a',size:10});rr(18,421,164,101,14,'rgba(5,13,22,.91)',C.line);txt('DI CHUYỂN',100,434,9,C.muted,800,'center');button('left',28,447,68,61,'◀',()=>{},{size:25});button('right',104,447,68,61,'▶',()=>{},{size:25});ui.push({id:'leftHold',x:28,y:447,w:68,h:61,hold:'left'},{id:'rightHold',x:104,y:447,w:68,h:61,hold:'right'});rr(778,425,160,91,g.hot>0?'#5c202b':'#5b2d2d',g.hot>0?C.red:'#ff8a75',2);txt(g.hot>0?'ĐANG HỒI NHIỆT':'GIỮ ĐỂ BẮN',858,444,10,'#ffd9c4',900,'center');txt('FIRE',858,480,22,'#fff2df',1000,'center');ui.push({id:'fireHold',x:778,y:425,w:160,h:91,hold:'fire'});if(noticeTime>0){rr(310,213,340,36,10,'rgba(9,22,34,.96)',C.cyan);txt(notice,480,231,11,C.cyan,800,'center')}}
function drawPaused(){drawPlaying();ui=[];rr(0,0,W,H,'rgba(2,7,13,.72)');rr(330,170,300,200,18,'#122337','#597389',2);txt('TẠM DỪNG',480,210,24,C.text,900,'center');button('resume',370,248,220,42,'TIẾP TỤC',()=>mode='playing',{fill:'#2d6048',stroke:C.green});button('exit',370,303,220,38,'VỀ XƯỞNG',()=>mode='garage')}
function drawResult(){bg(anim*.12);rr(240,70,480,390,20,'rgba(8,18,29,.97)','#526a7f',2);txt(resultWon?'ẢI HOÀN THÀNH':'XE ĐÃ THẤT THỦ',480,125,25,resultWon?C.green:C.red,1000,'center');txt(`Hạ ${kills}/${quota} zombie${boss?' • Boss còn sống':''}`,480,185,15,C.text,700,'center');txt(`Máu xe còn ${Math.max(0,Math.ceil(player.hp))} • Xu: ${save.coins}`,480,220,13,C.gold,700,'center');button('retry',280,350,175,46,'CHƠI LẠI',startMission);button('garage',505,350,175,46,'VỀ XƯỞNG',()=>mode='garage',{fill:'#315c48',stroke:C.green});if(resultWon)button('next',395,410,170,38,'ẢI TIẾP THEO',()=>{let n=chapter*10+level+1;if(n<30){chapter=Math.floor(n/10);level=n%10;startMission()}else mode='garage'},{fill:'#315c48',stroke:C.green})}
function draw(){ui=[];if(mode==='title')drawTitle();else if(mode==='garage')drawGarage();else if(mode==='shop')drawShop();else if(mode==='guide')drawGuide();else if(mode==='roulette')drawRoulette();else if(mode==='playing')drawPlaying();else if(mode==='paused')drawPaused();else drawResult()}
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;anim+=dt;if(mode==='playing')update(dt);if(mode==='roulette')updateRoulette(dt);if(noticeTime>0)noticeTime-=dt;draw();requestAnimationFrame(frame)}
function pos(e){let r=canvas.getBoundingClientRect(),u=(e.clientX-r.left)/r.width,v=(e.clientY-r.top)/r.height;if(matchMedia('(orientation:portrait)').matches)return{x:v*W,y:(1-u)*H};return{x:u*W,y:v*H}}
const pointers=new Map();function sync(){let moving=0,fire=false;for(let c of pointers.values()){if(c==='left')moving=-1;if(c==='right')moving=1;if(c==='fire')fire=true}moveDir=moving||((keys.left?-1:0)+(keys.right?1:0));fireHeld=fire||keys.fire}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);let p=pos(e);for(let i=ui.length-1;i>=0;i--){let h=ui[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){if(h.hold){pointers.set(e.pointerId,h.hold);sync()}else h.fn();return}}});function release(e){pointers.delete(e.pointerId);sync()}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='Enter')keys.fire=true;if(['1','2','3'].includes(e.key))switchSlot(Number(e.key)-1);if(e.key==='Escape'&&mode==='playing'){mode='paused';keys.fire=false}sync()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key===' '||e.key==='Enter'){keys.fire=false;fireSeconds=0}sync()});window.addEventListener('blur',()=>{pointers.clear();keys={left:false,right:false,fire:false};fireSeconds=0;sync()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing'){mode='paused';fireHeld=false}});requestAnimationFrame(frame);
})();
