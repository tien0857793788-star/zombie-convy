<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08111c"><title>Zombie Convoy</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a11;color:#f1f6fb;font:16px system-ui}#stage{position:fixed;inset:0;display:grid;place-items:center}canvas{width:min(100vw,177.7778dvh);height:auto;max-height:100dvh;aspect-ratio:16/9;touch-action:none}@media(orientation:portrait){canvas{position:absolute;left:50%;top:50%;width:100dvh;height:56.25dvh;max-height:none;transform:translate(-50%,-50%) rotate(90deg)}}</style>
</head>
<body><div id="stage"><p id="status">Đang tải Zombie Convoy…</p></div>
<script>
(async()=>{
'use strict';
const stage=document.getElementById('stage');
try{
 const url='https://raw.githubusercontent.com/tien0857793788-star/zombie-convy/6eedefc782e31bfd650b97533ab5794e5b167356/index.html';
 let html=await(await fetch(url,{cache:'no-store'})).text();
 const patch=(from,to,label)=>{if(!html.includes(from))throw Error('Không tìm thấy đoạn cần cập nhật: '+label);html=html.replace(from,to)};
 patch("let last=performance.now(),anim=0,lootModal=null,boxReveal=null,targetMode='zombies',bossDeathFx=0;","let last=performance.now(),anim=0,lootModal=null,boxReveal=null,targetMode='zombies',bossDeathFx=0;\nlet weaponSwitchCooldown=0,fireHoldSeconds=0,gunStates=Array.from({length:5},(_,i)=>({ammo:[30,6,80,1,8][i],heat:0,reload:0,overheated:0}));\nlet rouletteSpin=0,rouletteElapsed=0,rouletteAngle=0,rouletteStart=0,rouletteTarget=0,roulettePrize=0,rouletteResult='';\nconst rouletteLabels=['80 xu','120 xu','200 xu','300 xu','500 xu','800 xu','3 mảnh','5 mảnh','8 mảnh','12 mảnh','Hộp thường','Hộp cao cấp'];\nconst zombieGuide=[['WALKER • CẬN CHIẾN','Áp sát xe và gây sát thương cơ bản. Ưu tiên hạ trước khi chúng dồn lại.'],['SPITTER • TẦM XA','Phun dịch từ khoảng cách xa; màu xanh lá. Nên tiêu diệt sớm.'],['BRUTE • TANKER','Máu và sát thương cao, di chuyển chậm. Dùng rocket hoặc điện để tập trung hỏa lực.'],['BOSS: ĐẬP MẠNH / LIÊN HOÀN','Đòn cận chiến có vùng cảnh báo đỏ; di chuyển ra khỏi vùng trước khi trúng.'],['BOSS: DỊCH ĐỘC / SÓNG XUNG KÍCH','Né đạn dịch và sóng chạy ngang đường.'],['BOSS: LAO HÚC','Boss báo trước đường lao; di chuyển khỏi đường đỏ.']];");
 patch("const rate=continuous?w.rate*Math.pow(.945,rank):w.rate;","const rate=(continuous?w.rate*Math.pow(.945,rank):w.rate)*Math.max(.58,1-Math.min(.42,Math.max(0,fireHoldSeconds-6)*.07));");
 patch("if((player.cooldowns?.[activeSlot]||0)>0)return;","const state=gunStates[wi];if(state.overheated>0||state.reload>0)return;if(state.heat>=100){state.overheated=1.35;state.heat=100;toast(w.name+' QUÁ NÓNG — CHỜ 1,35 GIÂY!');return;}if(state.ammo<=0){state.reload=wi===3?2.1:(wi===1?1.65:1.4);toast(w.name+' ĐANG THAY BĂNG ĐẠN');return;}if((player.cooldowns?.[activeSlot]||0)>0)return;");
 patch("player.cooldowns[activeSlot]=rate;","player.cooldowns[activeSlot]=rate;state.ammo--;state.heat=Math.min(100,state.heat+4.5+1.05/w.rate);if(state.heat>=100){state.overheated=1.35;toast(w.name+' QUÁ NÓNG — CHỜ 1,35 GIÂY!');}");
 patch("elapsed+=dt;if(player.cooldowns)player.cooldowns=player.cooldowns.map(v=>Math.max(0,v-dt));const vehicle=getVehicle(),vu=getVehicleUpgrade();","elapsed+=dt;if(player.cooldowns)player.cooldowns=player.cooldowns.map(v=>Math.max(0,v-dt));weaponSwitchCooldown=Math.max(0,weaponSwitchCooldown-dt);fireHoldSeconds=fireHeld?fireHoldSeconds+dt:0;for(let i=0;i<gunStates.length;i++){const g=gunStates[i];g.overheated=Math.max(0,g.overheated-dt);g.reload=Math.max(0,g.reload-dt);if(g.reload===0&&g.ammo===0)g.ammo=[30,6,80,1,8][i];if(g.overheated===0)g.heat=Math.max(0,g.heat-dt*7);}if(rouletteSpin>0){rouletteElapsed=Math.min(1.35,rouletteElapsed+dt);const t=rouletteElapsed/1.35,ease=1-Math.pow(1-t,3);rouletteAngle=rouletteStart+(rouletteTarget-rouletteStart)*ease;if(t>=1){rouletteSpin=0;awardRoulettePrize();}}const vehicle=getVehicle(),vu=getVehicleUpgrade();");
 patch("addHit('changeSlot'+i,x,y,90,43,()=>{activeSlot=i;});","addHit('changeSlot'+i,x,y,90,43,()=>{if(activeSlot!==i){if(weaponSwitchCooldown>0){toast('Đổi súng đang hồi — chờ một chút!');return;}activeSlot=i;weaponSwitchCooldown=.55;const wi=save.slots[i]??0;gunStates[wi].reload=Math.max(gunStates[wi].reload,.55);}});");
 patch("drawCar(player.x,367,.92,false);","drawCar(player.x,367,.78,false);");
 patch("i===activeSlot&&!preview?'#d38c44':'#5a6d7d'","i===activeSlot&&!preview?(gunStates[save.slots[i]??0]?.overheated>0?'#ff394f':'#d38c44'):'#5a6d7d'");
 patch("const vu=getVehicleUpgrade();txt(`${getVehicle().name} • Máu ${getVehicle().hp+vu.armor*20} • Tốc độ ${getVehicle().speed+vu.engine*16}`,480,397,12,C.muted,600,'center');}","button('rouletteOpen',650,307,125,36,'🎡 VÒNG QUAY',()=>mode='roulette',{fill:'#59472b',stroke:C.gold,size:11});button('zombieGuideOpen',785,307,125,36,'📖 CẨM NANG',()=>mode='zombieGuide',{fill:'#24485a',stroke:C.cyan,size:11});const vu=getVehicleUpgrade();txt(`${getVehicle().name} • Máu ${getVehicle().hp+vu.armor*20} • Tốc độ ${getVehicle().speed+vu.engine*16}`,480,397,12,C.muted,600,'center');}");
 patch("else if(mode==='vehicles')drawVehicles();","else if(mode==='vehicles')drawVehicles();else if(mode==='roulette')drawRoulette();else if(mode==='zombieGuide')drawZombieGuide();");
 const injected=`
function rouletteCost(){return 250+Math.max(0,Number(save.rouletteRolls)||0)*175;}
function startRoulette(){const cost=rouletteCost();if(rouletteSpin)return;if(save.coins<cost){toast('Không đủ xu để quay!');return;}save.coins-=cost;save.rouletteRolls=(Number(save.rouletteRolls)||0)+1;roulettePrize=Math.floor(Math.random()*12);rouletteResult='';rouletteElapsed=0;rouletteStart=rouletteAngle;const slice=Math.PI*2/12;rouletteTarget=rouletteStart+Math.PI*2*7+(-Math.PI/2-(roulettePrize+.5)*slice-rouletteStart);rouletteSpin=1.35;store();}
function awardRoulettePrize(){const i=roulettePrize;if(i<6){const amount=[80,120,200,300,500,800][i];addCoins(amount);rouletteResult='Nhận '+amount+' xu!';}else if(i<10){const amount=[0,0,0,0,0,0,3,5,8,12][i],wi=Math.floor(Math.random()*weapons.length);save.weaponFragments[wi]=(save.weaponFragments[wi]||0)+amount;rouletteResult='Nhận '+amount+' mảnh '+weapons[wi].name+'!';}else{const type=i===10?'basic':'elite';save.boxes[type]=(save.boxes[type]||0)+1;rouletteResult='Nhận '+(type==='basic'?'1 hộp tiếp tế':'1 hộp cao cấp')+'!';}store();}
function drawRoulette(){drawBg(anim*.12);drawHeader('VÒNG QUAY 12 Ô','Mỗi lượt tăng giá thêm 175 xu • Phần thưởng nhận ngay');button('rouletteBack',28,88,100,37,'← XƯỞNG',()=>mode='garage',{size:12});const cx=480,cy=303,r=153,slice=Math.PI*2/12;for(let i=0;i<12;i++){const a=rouletteAngle+i*slice-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+slice);ctx.closePath();ctx.fillStyle=i%2?'#203c52':'#344c5d';ctx.fill();ctx.strokeStyle='#7890a0';ctx.lineWidth=2;ctx.stroke();const mid=a+slice/2;txt(rouletteLabels[i],cx+Math.cos(mid)*102,cy+Math.sin(mid)*102,10,i%2?C.text:C.gold,800,'center');}starShape(cx,cy,20,C.gold);ctx.beginPath();ctx.moveTo(cx-13,cy-r-13);ctx.lineTo(cx+13,cy-r-13);ctx.lineTo(cx,cy-r+13);ctx.closePath();ctx.fillStyle=C.red;ctx.fill();txt('LƯỢT QUAY: '+(Number(save.rouletteRolls)||0),480,120,14,C.cyan,900,'center');txt('GIÁ LƯỢT TIẾP: '+rouletteCost()+' xu',480,145,13,C.gold,800,'center');button('rouletteSpin',390,478,180,42,rouletteSpin?'ĐANG QUAY…':'QUAY • '+rouletteCost()+' xu',startRoulette,{disabled:rouletteSpin>0,fill:'#59472b',stroke:C.gold,size:13});if(rouletteResult)txt(rouletteResult,480,445,15,C.green,900,'center');}
function drawZombieGuide(){drawBg(anim*.12);drawHeader('CẨM NANG ZOMBIE & BOSS','Nhận biết vai trò và cách đối phó');button('guideBack',28,88,100,37,'← XƯỞNG',()=>mode='garage',{size:12});zombieGuide.forEach((entry,i)=>{const x=85+(i%2)*410,y=145+Math.floor(i/2)*105;rr(x,y,380,82,12,'#172b3d','#40596f');txt(entry[0],x+18,y+23,13,i<3?[C.green,C.cyan,C.orange][i]:C.red,900);txt(entry[1],x+18,y+53,11,C.text,600);});txt('Gợi ý: liên thanh hợp mục tiêu thường • shotgun mạnh ở gần • rocket gây nổ diện rộng • súng điện lan mục tiêu.',480,478,11,C.gold,700,'center');}
`;
 patch('function draw(){ui=[];',injected+'\nfunction draw(){ui=[];','thêm màn hình vòng quay và cẩm nang');
 patch("drawHealth();\n if(boss){","const activeWi=save.slots[activeSlot]??0,activeGun=gunStates[activeWi];rr(18,157,302,24,7,'rgba(5,13,22,.92)','#40576b');const heatColor=activeGun.overheated>0?'#ff394f':activeGun.heat>65?C.orange:C.green;rr(25,164,150,9,4,'#293746');rr(25,164,150*clamp(activeGun.heat/100,0,1),9,4,heatColor);txt(activeGun.overheated>0?'QUÁ NÓNG • '+activeGun.overheated.toFixed(1)+'s':`ĐẠN ${activeGun.ammo}/${[30,6,80,1,8][activeWi]} • NHIỆT ${Math.round(activeGun.heat)}%`,190,168,9,heatColor,900,'center');drawHealth();\n if(boss){");
 patch("if(mode==='playing'&&!lootModal&&!boxReveal)updateGame(dt);","if(mode==='playing'&&!lootModal&&!boxReveal)updateGame(dt);");
 html=html.replace(/<script>([\\s\\S]*?)<\\/script>/,(_,js)=>'<script>'+js+'</script>');
 document.open();document.write(html);document.close();
}catch(err){stage.innerHTML='<p style="color:#ff9d5c;padding:24px">Không tải được game hoặc không áp dụng được bản cập nhật. Hãy tải lại trang. ('+String(err.message||err)+')</p>';console.error(err);}
})();
</script></body></html>
