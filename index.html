function awardRoulettePrize(index){

 if(prize.kind==='coins'){addCoins(prize.amount);message=`Nhận ${prize.amount} xu`;}
 else if(prize.kind==='fragments'){

  const box=prize.kind==='eliteBox'?'elite':'basic';save.boxes[box]=(save.boxes[box]||0)+1;message=box==='elite'?'Nhận 1 hộp tiếp tế cao cấp':'Nhận 1 hộp tiếp tế';

  save.petBox=(save.petBox||0)+1;message='Nhận 1 hộp mảnh pet';
 }else if(prize.kind==='weapon'){
  const locked=weapons.map((w,i)=>i).filter(i=>!save.owned.includes(i));
  if(locked.length){const wi=locked[Math.floor(Math.random()*locked.length)];save.owned.push(wi);message=`Mở khóa ${weapons[wi].name}`;}
  else{const wi=Math.floor(Math.random()*weapons.length);save.weaponFragments[wi]=(save.weaponFragments[wi]||0)+8;message=`Đã có đủ súng • nhận 8 mảnh ${weapons[wi].name}`;}

function startRoulette(){

 save.coins-=cost;save.rouletteRolls=(save.rouletteRolls||0)+1;store();
 if(!Array.isArray(save.rouletteRemaining))save.rouletteRemaining=Array.from({length:12},(_,i)=>i);if(!save.rouletteRemaining.length)save.rouletteRemaining=Array.from({length:12},(_,i)=>i);const available=save.rouletteRemaining;const totalWeight=available.reduce((sum,i)=>sum+(rouletteRewards[i].weight||1),0);let roll=Math.random()*totalWeight;let index=available[available.length-1];for(const i of available){roll-=rouletteRewards[i].weight||1;if(roll<=0){index=i;break;}}const sector=Math.PI*2/rouletteRewards.length;
 const from=rouletteAngle,minimum=from+Math.PI*2*5;
 const to=Math.ceil((minimum+(index+.5)*sector)/(Math.PI*2))*(Math.PI*2)-(index+.5)*sector;
 rouletteSpin={index,from,to,started:anim,duration:3.1};
}
function updateRoulette(){

}

function spawnEnemy(){
 // Độ khó tăng theo từng ải, có giới hạn để vẫn cân bằng ở cuối chiến dịch.
 const diff=chapter*10+level, ramp=(1+diff*.052+diff*diff*.00115)*(1+Math.floor(diff/2)*.2);
 const r=Math.random();
 let type=r<.30?'walker':r<.49?'runner':r<.58?'spitter':r<.78?'brute':r<.91?'armored':'bomber';
 if(level===9&&spawned===quota-1)type='brute';
 const profile={walker:[.95,48,42],runner:[.92,38,88],spitter:[1.05,66,34],brute:[1.35,145,27],armored:[1.28,210,20],bomber:[1.02,58,74]}[type];
 let [size,baseHp,baseSpeed]=profile;
 let hp=Math.round((baseHp+diff*3.2)*ramp);
 let speed=(baseSpeed+diff*.65)*(1+diff*.012);
 enemies.push({x:990+Math.random()*70,y:310+Math.random()*92,hp,maxHp:hp,speed,type,size,attack:type==='spitter'?1.2:.0,hit:0,exploded:false,knockback:0,slowTimer:0,slowFactor:1});spawned++;
}
function targetFor(){let list=enemies.filter(e=>e.x>player.x+55);if(targetMode==='boss'&&boss&&boss.x>player.x+55)return boss;if(targetMode==='zombies'&&list.length){list.sort((a,b)=>a.x-b.x);return list[0];}if(boss&&boss.x>player.x+55)return boss;if(!list.length)return null;list.sort((a,b)=>a.x-b.x);return list[0];}
function allTargets(){return boss?[...enemies,boss]:enemies;}
function gunMuzzle(slot=activeSlot){const tx=65+slot*65;return {x:player.x+22+(tx+34)*PLAYER_CAR_SCALE,y:PLAYER_CAR_Y-33*PLAYER_CAR_SCALE};}
function shoot(){
 const wi=currentWeaponIndex(),w=weapons[wi],rt=weaponRuntime[wi],rank=weaponRank(wi),target=targetFor();
 if(!target||!rt||switchLock>0||rt.overheated>0||rt.reload>0||rt.cooldown>0)return;
 if(rt.ammo<=0){rt.reload=w.reloadTime;toast(w.name+' HẾT ĐẠN • ĐANG NẠP');return;}
 const slowFire=[1,3,4].includes(wi),continuous=[0,2].includes(wi);
 const baseRate=continuous?w.rate*Math.pow(.945,rank):w.rate;
 const rate=baseRate*(triggerHoldTime>=3?.72:1);
 rt.cooldown=rate;rt.ammo--;rt.heat=Math.min(100,rt.heat+w.heatPerShot);
 if(rt.heat>=100){rt.heat=100;rt.overheated=1.35;toast('SÚNG QUÁ NHIỆT • CHỜ 1.35 GIÂY!');}
 if(rt.ammo===0&&rt.reload<=0)rt.reload=w.reloadTime;
 const muzzle=gunMuzzle(activeSlot),sx=muzzle.x,sy=muzzle.y,dx=target.x-sx,dy=target.y-sy,dist=Math.hypot(dx,dy)||1;
 let damage=w.damage*(1+rank*.035+(slowFire&&rank>=1?.10:0));
 if(w.kind==='electric'){
  const chain=3+(rank>=2?1:0)+(rank>=4?1:0),radius=190+rank*8,chainDamage=.58+rank*.025;
  const near=allTargets().filter(e=>Math.hypot(e.x-target.x,e.y-target.y)<radius).sort((a,b)=>Math.hypot(a.x-target.x,a.y-target.y)-Math.hypot(b.x-target.x,b.y-target.y)).slice(0,chain);
  near.forEach((e,i)=>hurt(e,damage*(i===0?1:chainDamage),e===boss?18:knockbackFor(e)));
  for(let e of near)particles.push({x:e.x,y:e.y-15,life:.22,max:.22,color:'#a4edff',kind:'spark'});
 }else if(w.kind==='flame'){
  const reach=Math.max(245+rank*24,boss?650:0),width=78+rank*3;
  const near=allTargets().filter(e=>e.x>sx&&e.x<sx+reach&&Math.abs(e.y-sy)<width);
  near.forEach(e=>hurt(e,damage,0,.48));
  for(let i=0;i<22;i++)particles.push({x:sx+25+Math.random()*Math.min(210,reach*.45),y:sy+(Math.random()-.5)*68,vx:65+Math.random()*130,vy:(Math.random()-.5)*90,life:.32+Math.random()*.25,max:.55,color:['#fff3a6','#ffcf62','#ff8848','#e94e32'][i%4],kind:'flame',r:5+Math.random()*8});
 }else if(w.kind==='spread'){
  const pellets=5+(rank>=2?1:0)+(rank>=4?1:0),spread=.065*Math.max(.58,1-rank*.09),pierceCount=rank>=3?3:2;
  for(let n=0;n<pellets;n++){let a=(n-(pellets-1)/2)*spread,ang=Math.atan2(dy,dx)+a;bullets.push({x:sx,y:sy,vx:Math.cos(ang)*w.speed,vy:Math.sin(ang)*w.speed,damage:damage,color:w.color,life:.8,r:3,knockback:knockbackFor(target),pierceRemaining:pierceCount,hitTargets:[],justSpawned:true});}
 }else{
  const blast=95+rank*10;
  bullets.push({x:sx,y:sy,vx:dx/dist*w.speed,vy:dy/dist*w.speed,damage,color:w.color,life:w.kind==='rocket'?1.5:1.6,r:w.kind==='rocket'?6:3,rocket:w.kind==='rocket',blast,splash:.48+rank*.035,knockback:knockbackFor(target),justSpawned:true});
 }
 particles.push({x:sx,y:sy,life:.16,max:.16,color:w.color,kind:'muzzle',r:12});
 if(w.kind==='rocket')particles.push({x:sx-6,y:sy,life:.35,max:.35,color:'#ffb36c',kind:'smoke'});
 if(w.kind==='spread')particles.push({x:sx,y:sy,life:.18,max:.18,color:'#ffe0a0',kind:'muzzle',r:18});
}

function knockbackFor(e){if(e===boss)return 18;return ({walker:39,runner:44,spitter:34,brute:19,armored:11,bomber:31}[e.type]||27.5);}
function hurt(e,dmg,knockback=0,slowDuration=0){if(e===boss){e.hp-=dmg;e.hit=.12;floating.push({x:e.x,y:e.y-75,text:'-'+Math.round(dmg),life:.55});if(e.hp<=0){addCoins(220+chapter*70);bossDeathFx=1.4;for(let n=0;n<26;n++)particles.push({x:e.x+(Math.random()-.5)*55,y:e.y+(Math.random()-.5)*75,life:.45+Math.random()*.55,max:1,color:n%3===0?'#fff0a6':(n%2?'#ff784e':'#ffbe67'),kind:'burst'});boss=null;save.achievements.first_bossDone=true;lootModal=null;store();checkAchievements();}return;}if(!enemies.includes(e))return;if(knockback>0)e.knockback=Math.max(e.knockback||0,knockback);if(slowDuration>0){e.slowTimer=Math.max(e.slowTimer||0,slowDuration);e.slowFactor=.52;}if(e.type==='armored')dmg*=.62;e.hp-=dmg;e.hit=.12;floating.push({x:e.x,y:e.y-28,text:'-'+Math.round(dmg),life:.55});if(e.hp<=0){let idx=enemies.indexOf(e);if(idx>=0){enemies.splice(idx,1);kills++;save.totalKills=(save.totalKills||0)+1;addCoins(e.type==='armored'?22:e.type==='brute'?15:e.type==='spitter'?9:e.type==='bomber'?8:e.type==='runner'?7:5);particles.push({x:e.x,y:e.y,life:.35,max:.35,color:'#a6bb83',kind:'burst'});checkAchievements();}}}

 let opening=!!boxReveal,phase=opening?Math.min(1,(anim-boxReveal.started)/.75):1;rr(245,55,470,430,22,'#122438','#d5a85f',2);txt(opening?'MỞ HỘP TIẾP TẾ':'BOSS ĐÃ BỊ HẠ!',480,94,25,C.gold,1000,'center');let pulse=.5+.5*Math.sin(anim*9);ctx.save();ctx.shadowColor='#ffc96b';ctx.shadowBlur=24*pulse;rr(427,122,106,82,16,'#76542c','#f5d28a',3);txt('▣',480,164,52,'#ffe7a5',1000,'center');ctx.restore();if(opening){txt(phase<1?'ĐANG MỞ KHÓA...':'PHẦN THƯỞNG',480,225,13,C.cyan,900,'center');txt(`+${boxReveal.coins} xu`,480,253,17,C.gold,900,'center');boxReveal.rewards.forEach((r,i)=>{let x=315+i*112;rr(x,282,102,92,12,'#1b3448','#5c7890',1.2);circle(x+51,311,17,weapons[r.wi].color);txt(weapons[r.wi].short,x+51,311,10,'#142230',900,'center');txt(weapons[r.wi].name,x+51,342,8,C.text,800,'center');txt('+'+r.frags+' MẢNH',x+51,360,10,C.gold,900,'center');});button('claimBox',350,415,260,44,phase<1?'ĐANG MỞ...':'ẤN ĐỂ NHẬN',()=>claimBox(),{disabled:phase<1,fill:'#315d47',stroke:C.green,size:14});}else{txt('Hộp thưởng của boss đã rơi xuống!',480,230,13,C.muted,700,'center');lootModal.rewards.forEach((r,i)=>{let x=315+i*112;rr(x,265,102,90,12,'#1b3448','#5c7890',1.2);circle(x+51,294,17,weapons[r.wi].color);txt(weapons[r.wi].short,x+51,294,10,'#142230',900,'center');txt(weapons[r.wi].name,x+51,325,8,C.text,800,'center');txt('+'+r.frags+' MẢNH',x+51,344,10,C.gold,900,'center');});txt(`+${lootModal.coins} xu`,480,382,16,C.gold,900,'center');if(!lootModal.rewards.length)txt('Boss này đã nhận mảnh ở lần đầu • không nhận lại mảnh',480,404,10,C.muted,700,'center');button('takeBossLoot',350,423,125,42,'NHẬN',()=>{for(const r of lootModal.rewards)save.weaponFragments[r.wi]=(save.weaponFragments[r.wi]||0)+r.frags;if(lootModal.rewards.length)save.boxes.elite=(save.boxes.elite||0)+1;lootModal=null;checkAchievements();store();toast('Đã nhận thưởng boss!');},{fill:'#315d47',stroke:C.green,size:11});button('skipBossLoot',485,423,125,42,'BỎ QUA',()=>{if(lootModal.rewards.length)save.boxes.elite=(save.boxes.elite||0)+1;lootModal=null;store();toast('Đã bỏ qua thưởng boss.');},{fill:'#35475a',size:11});}}
function draw(){ui=[];if(mode==='title')drawTitle();else if(mode==='roulette')drawRoulette();else if(mode==='zombieGuide')drawZombieGuide();else if(mode==='settings')drawSettings();else if(mode==='leaderboard')drawLeaderboard();else if(mode==='changelog')drawChangelog();else if(mode==='chapters')drawChapters();else if(mode==='levels')drawLevels();else if(mode==='garage')drawGarage();else if(mode==='vehicles')drawVehicles();else if(mode==='achievements')drawAchievements();else if(mode==='vault')drawVault();else if(mode==='shop')drawShop();else if(mode==='upgrades')drawUpgrades();else if(mode==='playing')drawPlaying();else if(mode==='paused')drawPaused();else if(mode==='result')drawResult();if(lootModal||boxReveal||petBoxReveal)drawLootOverlay();if(claimModal)drawClaimOverlay();if(noticeTimer>0){const edge=noticeKind==='achievement'?C.green:C.cyan;rr(185,78,590,40,11,'rgba(7,18,29,.96)',edge,1.6);txt(notice,480,98,notice.length>66?10:12,noticeKind==='achievement'?C.green:C.cyan,900,'center');}}
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;anim+=dt;if(mode==='playing'&&!lootModal&&!boxReveal&&!petBoxReveal)updateGame(dt);if(mode==='roulette')updateRoulette();if(noticeTimer>0)noticeTimer-=dt;draw();requestAnimationFrame(frame)}
function pointerPos(e){let r=canvas.getBoundingClientRect(),u=(e.clientX-r.left)/r.width,v=(e.clientY-r.top)/r.height;let x,y;if(matchMedia('(orientation: portrait)').matches){ // canvas rotated 90deg clockwise in portrait
 x=v*W;y=(1-u)*H;
 }else{x=u*W;y=v*H;}return {x,y};}
function dispatch(x,y){for(let i=ui.length-1;i>=0;i--){let h=ui[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return true;}}return false;}
const pointerControls=new Map();let keyboardMove=0,keyboardFire=false;
function syncHeldControls(){let pointerMove=0,swipeMove=0,pointerFire=false;for(const control of pointerControls.values()){if(control.move)pointerMove=control.move;if(control.fire)pointerFire=true;if(control.swipe){const dx=control.currentX-control.startX;if(Math.abs(dx)>7)swipeMove=Math.sign(dx);}}moveDir=pointerMove||swipeMove||keyboardMove;fireHeld=pointerFire||keyboardFire;}
function dispatch(x,y,pointerId){for(let i=ui.length-1;i>=0;i--){let h=ui[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){if(h.hold){pointerControls.set(pointerId,h.hold);syncHeldControls();}else if(h.fn)h.fn();return true;}}return false;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);let p=pointerPos(e);const hit=dispatch(p.x,p.y,e.pointerId);if(!hit&&mode==='playing'&&p.y>=160&&p.y<=520){pointerControls.set(e.pointerId,{swipe:true,startX:p.x,currentX:p.x});syncHeldControls();}});
canvas.addEventListener('pointermove',e=>{const control=pointerControls.get(e.pointerId);if(!control||!control.swipe)return;e.preventDefault();control.currentX=pointerPos(e).x;syncHeldControls();});
canvas.addEventListener('pointerup',e=>{pointerControls.delete(e.pointerId);syncHeldControls();});
canvas.addEventListener('pointercancel',e=>{pointerControls.delete(e.pointerId);syncHeldControls();});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')keyboardMove=-1;if(e.key==='ArrowRight'||e.key==='d')keyboardMove=1;if(e.key===' '||e.key==='Enter')keyboardFire=true;if(e.key==='Escape'&&mode==='playing'){mode='paused';keyboardFire=false;keyboardMove=0;pointerControls.clear();}if(e.key==='1'||e.key==='2'||e.key==='3')switchWeaponSlot(Number(e.key)-1);if(e.key.toLowerCase()==='e')activatePet();syncHeldControls();});
window.addEventListener('keyup',e=>{if(['ArrowLeft','a'].includes(e.key)&&keyboardMove===-1)keyboardMove=0;if(['ArrowRight','d'].includes(e.key)&&keyboardMove===1)keyboardMove=0;if(e.key===' '||e.key==='Enter')keyboardFire=false;syncHeldControls();});
// Clear each held input independently if focus is lost.
window.addEventListener('blur',()=>{pointerControls.clear();keyboardMove=0;keyboardFire=false;syncHeldControls();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pointerControls.clear();keyboardMove=0;keyboardFire=false;syncHeldControls();if(mode==='playing')mode='paused';}});
requestAnimationFrame(frame);
})();
</script>
