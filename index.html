 {name:'SPITTER',role:'TẦM XA • PHUN ĐỘC',desc:'Giữ khoảng cách và bắn dịch độc về phía xe.',color:'#8cae75'},

function cloneDefault(){return JSON.parse(JSON.stringify(defaultSave))}
if(!localStorage.getItem('zconvoy_name_prompted')){setTimeout(()=>{const n=prompt('Đặt tên người chơi trong Zombie Convoy:','Người sống sót');if(n&&n.trim()){save.playerName=n.trim().slice(0,18);store();}localStorage.setItem('zconvoy_name_prompted','1');},250);}
function loadSave(){
 try{
  let x=JSON.parse(localStorage.getItem('zconvoy_save')||'null');if(!x)return cloneDefault();
  const base=cloneDefault(),stars=x.stars||base.stars;
  const totalStars=stars.flat().reduce((a,b)=>a+(Number(b)||0),0);
  const out={...base,...x,playerName:x.playerName||base.playerName,totalCoinsEarned:x.totalCoinsEarned||0,stageRecords:x.stageRecords||{},rouletteRolls:Math.max(0,Math.floor(x.rouletteRolls||0)),upgrades:{...base.upgrades,...(x.upgrades||{})},stars,slots:x.slots||[0,null,null],owned:x.owned||[0],boxes:{...base.boxes,...(x.boxes||{})},achievements:{...(x.achievements||{})},openedCrates:x.openedCrates||0,totalKills:x.totalKills||0,weaponRanks:Array.from({length:5},(_,i)=>clamp(Math.floor((x.weaponRanks||[])[i]||0),0,4)),weaponUpgradeSteps:Array.from({length:5},(_,i)=>clamp(Math.floor((x.weaponUpgradeSteps||[])[i]||0),0,2)),weaponFragments:Array.from({length:5},(_,i)=>(x.weaponFragments||[])[i]||0),vehiclesOwned:x.vehiclesOwned||['scout'],vehicle:x.vehicle||'scout',starTokens:x.starTokens==null?totalStars:x.starTokens,vehicleUpgrades:{...base.vehicleUpgrades}};
  for(const v of vehicleDefs)out.vehicleUpgrades[v.id]={...base.vehicleUpgrades[v.id],...((x.vehicleUpgrades||{})[v.id]||{})};
  if(!out.vehiclesOwned.includes('scout'))out.vehiclesOwned.unshift('scout');
  if(!vehicleDefs.some(v=>v.id===out.vehicle))out.vehicle='scout';
  return out;
 }catch(e){return cloneDefault()}
}
function store(){try{localStorage.setItem('zconvoy_save',JSON.stringify(save));}catch(e){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function getVehicle(){return vehicleDefs.find(v=>v.id===save.vehicle)||vehicleDefs[0]}
function getVehicleUpgrade(){return save.vehicleUpgrades[save.vehicle]||{armor:0,engine:0,plating:0}}
function isBossStage(){return (chapter*10+level+1)%5===0}
function weaponRank(i){return save.weaponRanks[i]||0}
function fragmentNeed(i){return 3+weaponRank(i)}
function weaponStep(i){return save.weaponUpgradeSteps?.[i]||0}
function weaponUpgradeCost(i){return 110+weaponRank(i)*105+weaponStep(i)*35}
function achievementDefs(){
 const defs=[];
 const add=(id,name,desc,reward,ok,box=0)=>defs.push({id,name,desc,reward,box,ok});
 [[10,80],[25,140],[50,220],[100,350],[250,550],[500,800],[1000,1200],[2500,1800],[5000,2600],[10000,4000]].forEach(([n,r])=>add('kills_'+n,'THỢ SĂN '+n,'Tiêu diệt tổng cộng '+n+' zombie',r,()=>save.totalKills>=n,n>=1000?1:0));
 [[500,100],[1500,180],[3000,280],[5000,420],[10000,650],[25000,1000],[50000,1600],[100000,2500]].forEach(([n,r])=>add('coins_'+n,'TAY CÀY '+n,'Kiếm tổng cộng '+n+' xu từ nhiệm vụ, zombie và phần thưởng',r,()=>save.totalCoinsEarned>=n,n>=25000?1:0));
 [[1,120],[5,300],[10,550],[15,800],[20,1100],[25,1500],[30,2200]].forEach(([n,r])=>add('stages_'+n,'CHINH PHỤC '+n+' ẢI','Hoàn thành tổng cộng '+n+' ải khác nhau',r,()=>Object.values(save.stageRecords||{}).filter(v=>v&&v.completed).length>=n,n>=20?1:0));
 add('first_boss','KẺ SĂN TRÙM','Hạ gục boss lần đầu',450,()=>!!save.achievements.first_bossDone,1);
 return defs;
}
function addCoins(n){n=Math.max(0,Math.floor(n||0));save.coins+=n;save.totalCoinsEarned=(save.totalCoinsEarned||0)+n;return n;}
function checkAchievements(){for(const a of achievementDefs()){if(!save.achievements[a.id]&&a.ok()){save.achievements[a.id]=true;addCoins(a.reward);if(a.box)save.boxes.elite=(save.boxes.elite||0)+a.box;toast('THÀNH TỰU: '+a.name+' • +'+a.reward+' xu'+(a.box?' + hộp cao cấp':''));}}store()}
function rr(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function txt(s,x,y,size=16,color=C.text,weight=600,align='left'){ctx.font=`${weight} ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(String(s),x,y)}
function line(x1,y1,x2,y2,color=C.line,w=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function circle(x,y,r,fill,stroke=null,w=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=w;ctx.strokeStyle=stroke;ctx.stroke()}}
function button(id,x,y,w,h,label,fn,opt={}){const disabled=!!opt.disabled;rr(x,y,w,h,opt.r||12,disabled?'#172330':(opt.fill||'#20364a'),disabled?'#2b3d4c':(opt.stroke||'#49657c'),1);if(opt.glow&&!disabled){ctx.save();ctx.shadowColor=opt.glow;ctx.shadowBlur=14;rr(x,y,w,h,opt.r||12,null,opt.glow,1);ctx.restore()}if(opt.icon)txt(opt.icon,x+20,y+h/2,opt.size||18,opt.color||C.text,800,'center');txt(label,x+(opt.icon?39:w/2),y+h/2,opt.size||14,disabled?'#607488':(opt.color||C.text),800,opt.icon?'left':'center');if(!disabled)ui.push({id,x,y,w,h,fn});}
function addHit(id,x,y,w,h,fn){ui.push({id,x,y,w,h,fn})}
function addHoldHit(id,x,y,w,h,control){ui.push({id,x,y,w,h,hold:control})}
function drawBg(t=0){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101e31');g.addColorStop(.56,'#233247');g.addColorStop(.57,'#222c36');g.addColorStop(1,'#111a23');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // moon / smoky glow
 const glow=ctx.createRadialGradient(760,115,8,760,115,200);glow.addColorStop(0,'rgba(255,181,125,.18)');glow.addColorStop(1,'rgba(255,181,125,0)');ctx.fillStyle=glow;ctx.fillRect(540,0,420,330);circle(760,105,28,'#d9d4c1');circle(773,98,29,'#18283a');
 // skyline
 for(let i=0;i<19;i++){let x=i*58-((t*12)%58),w=35+(i*17%24),h=95+(i*47%130);ctx.fillStyle=i%3===0?'#1a2938':'#1b2a39';ctx.fillRect(x,300-h,w,h);ctx.fillStyle='rgba(255,203,130,.18)';for(let yy=315-h;yy<292;yy+=23)for(let xx=x+8;xx<x+w-4;xx+=14)if(((xx+yy+i)%4)<2)ctx.fillRect(xx,yy,5,8);}
 // distant giant boss silhouette on milestone stages (10 / 20 / 30)
 if(mode==='playing'&&[10,20,30].includes(chapter*10+level+1)){ctx.save();ctx.globalAlpha=.26;let bx=760,by=285;circle(bx,by-110,76,'#52645a','#91a08a',5);rr(bx-82,by-75,164,170,35,'#46584f','#87947c',4);line(bx-65,by-25,bx-125,by+65,'#52645a',28);line(bx+65,by-25,bx+130,by+70,'#52645a',28);circle(bx-25,by-115,9,'#e65e59');circle(bx+25,by-115,9,'#e65e59');ctx.restore();}
 // road / ground
 ctx.fillStyle='#161e27';ctx.fillRect(0,385,W,155);ctx.fillStyle='#2d3640';ctx.fillRect(0,385,W,8);ctx.fillStyle='#77818a';ctx.fillRect(0,393,W,2);for(let i=0;i<8;i++){let x=(i*160-(t*75)%160);ctx.fillStyle='#9b9b8e';ctx.fillRect(x,466,72,5);}ctx.fillStyle='#29323b';ctx.fillRect(0,510,W,30);
 // debris
 for(let i=0;i<9;i++){let x=((i*131-(t*26)%1080)+1080)%1080-40;ctx.fillStyle='#303b45';ctx.beginPath();ctx.moveTo(x,390);ctx.lineTo(x+20,376+(i%3)*5);ctx.lineTo(x+42,390);ctx.fill();}
}
function drawZombie(e){let x=e.x,y=e.y,s=e.size;ctx.save();ctx.translate(x,y);if(e.type==='brute')s*=1.3;if(e.hit>0){ctx.globalAlpha=.65+Math.sin(anim*35)*.25}let skin=e.type==='spitter'?'#8cae75':e.type==='brute'?'#7c8b70':e.type==='runner'?'#b5c77d':e.type==='armored'?'#64796d':e.type==='bomber'?'#c68158':'#9aa883';
 // shadow
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,20*s,17*s,5*s,0,0,Math.PI*2);ctx.fill();
 // legs
 ctx.strokeStyle='#4d5e50';ctx.lineWidth=7*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5*s,8*s);ctx.lineTo(-10*s,22*s);ctx.moveTo(6*s,8*s);ctx.lineTo(12*s,22*s);ctx.stroke();
 // body
 rr(-11*s,-12*s,22*s,29*s,7*s,skin,'#52634f',1);ctx.strokeStyle=skin;ctx.lineWidth=6*s;ctx.beginPath();ctx.moveTo(-9*s,-6*s);ctx.lineTo(-18*s,5*s);ctx.moveTo(9*s,-5*s);ctx.lineTo(18*s,4*s);ctx.stroke();
 // head
 circle(0,-20*s,10*s,skin,'#52634f',1);circle(-4*s,-21*s,2.2*s,'#ff6961');circle(4*s,-21*s,2.2*s,'#ff6961');line(-3*s,-14*s,4*s,-13*s,'#3d4b40',1.5);
 if(e.type==='spitter'){circle(0,-5*s,3*s,'#a6d96d')}if(e.type==='brute'){rr(-17*s,-31*s,34*s,12*s,5*s,'#56635b');}

 ctx.restore();
}
function drawCar(x,y,scale=1,preview=false,vehicleId=null){const v=vehicleDefs.find(q=>q.id===(vehicleId||save.vehicle))||vehicleDefs[0];ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(95,54,153,17,0,0,Math.PI*2);ctx.fill();

 // cabin
 ctx.beginPath();ctx.moveTo(42,5);ctx.lineTo(59,-27);ctx.lineTo(158,-27);ctx.lineTo(184,5);ctx.closePath();ctx.fillStyle=v.cabin;ctx.fill();ctx.strokeStyle='#b4c2c9';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#9fd0d5';ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(66,-22);ctx.lineTo(105,-22);ctx.lineTo(105,1);ctx.lineTo(52,1);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(113,-22);ctx.lineTo(152,-22);ctx.lineTo(173,1);ctx.lineTo(113,1);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
 // armor plating
 rr(-4,7,28,12,3,'#d1a15d','#ffe0a1',1);rr(183,8,42,12,3,'#253442','#82929d',1);circle(232,13,5,'#ffcf69');
  if(v.id==='tank'){rr(10,-4,28,17,4,'#778477','#c3c9a0',1);rr(178,-5,42,15,4,'#68786b','#c3c9a0',1);}

}

function spawnEnemy(){
 // Độ khó tăng theo từng ải, có giới hạn để vẫn cân bằng ở cuối chiến dịch.
 const diff=chapter*10+level, ramp=1+diff*.052+diff*diff*.00115;
 const r=Math.random();
 let type=r<.30?'walker':r<.49?'runner':r<.68?'spitter':r<.82?'brute':r<.92?'armored':'bomber';
 if(level===9&&spawned===quota-1)type='brute';
 const profile={walker:[.95,48,42],runner:[.92,38,88],spitter:[1.05,66,34],brute:[1.35,145,27],armored:[1.28,210,20],bomber:[1.02,58,74]}[type];
 let [size,baseHp,baseSpeed]=profile;
 let hp=Math.round((baseHp+diff*3.2)*ramp);
 let speed=(baseSpeed+diff*.65)*(1+diff*.012);
 enemies.push({x:990+Math.random()*70,y:310+Math.random()*92,hp,maxHp:hp,speed,type,size,attack:type==='spitter'?1.2:.0,hit:0,exploded:false});spawned++;
}
function targetFor(){let list=enemies.filter(e=>e.x>player.x+55);if(targetMode==='boss'&&boss&&boss.x>player.x+55)return boss;if(targetMode==='zombies'&&list.length){list.sort((a,b)=>a.x-b.x);return list[0];}if(boss&&boss.x>player.x+55)return boss;if(!list.length)return null;list.sort((a,b)=>a.x-b.x);return list[0];}
function allTargets(){return boss?[...enemies,boss]:enemies;}
function shoot(){
 const wi=currentWeaponIndex(),w=weapons[wi],rt=weaponRuntime[wi],rank=weaponRank(wi),target=targetFor();
 if(!target||!rt||switchLock>0||rt.overheated>0||rt.reload>0||rt.cooldown>0)return;
 if(rt.ammo<=0){rt.reload=w.reloadTime;toast(w.name+' HẾT ĐẠN • ĐANG NẠP');return;}
 const slowFire=[1,3,4].includes(wi),continuous=[0,2].includes(wi);
 const baseRate=continuous?w.rate*Math.pow(.945,rank):w.rate;
 const rate=baseRate*(triggerHoldTime>=6?.72:1);
 rt.cooldown=rate;rt.ammo--;rt.heat=Math.min(100,rt.heat+w.heatPerShot);
 if(rt.heat>=100){rt.heat=100;rt.overheated=1.35;toast('SÚNG QUÁ NHIỆT • CHỜ 1.35 GIÂY!');}
 if(rt.ammo===0&&rt.reload<=0)rt.reload=w.reloadTime;
 const sx=player.x+(85+activeSlot*65)*.92,sy=367-34*.92,dx=target.x-sx,dy=target.y-sy,dist=Math.hypot(dx,dy)||1;
 let damage=w.damage*(1+rank*.035+(slowFire&&rank>=1?.10:0));
 if(w.kind==='electric'){
  const chain=3+(rank>=2?1:0)+(rank>=4?1:0),radius=125+rank*5,chainDamage=.58+rank*.025;
  const near=allTargets().filter(e=>Math.hypot(e.x-target.x,e.y-target.y)<radius).sort((a,b)=>Math.hypot(a.x-target.x,a.y-target.y)-Math.hypot(b.x-target.x,b.y-target.y)).slice(0,chain);
  near.forEach((e,i)=>hurt(e,damage*(i===0?1:chainDamage)));
  for(let e of near)particles.push({x:e.x,y:e.y-15,life:.22,max:.22,color:'#a4edff',kind:'spark'});
 }else if(w.kind==='flame'){
  const reach=Math.max(245+rank*24,boss?650:0),width=78+rank*3;
  const near=allTargets().filter(e=>e.x>sx&&e.x<sx+reach&&Math.abs(e.y-sy)<width);
  near.forEach(e=>hurt(e,damage));
  for(let i=0;i<22;i++)particles.push({x:sx+25+Math.random()*Math.min(210,reach*.45),y:sy+(Math.random()-.5)*68,vx:65+Math.random()*130,vy:(Math.random()-.5)*90,life:.32+Math.random()*.25,max:.55,color:['#fff3a6','#ffcf62','#ff8848','#e94e32'][i%4],kind:'flame',r:5+Math.random()*8});
 }else if(w.kind==='spread'){
  const pellets=5+(rank>=2?1:0)+(rank>=4?1:0),spread=.095*Math.max(.58,1-rank*.105);
  for(let n=0;n<pellets;n++){let a=(n-(pellets-1)/2)*spread,ang=Math.atan2(dy,dx)+a;bullets.push({x:sx,y:sy,vx:Math.cos(ang)*w.speed,vy:Math.sin(ang)*w.speed,damage:damage,color:w.color,life:.8,r:3});}
 }else{
  const blast=95+rank*10;
  bullets.push({x:sx,y:sy,vx:dx/dist*w.speed,vy:dy/dist*w.speed,damage,color:w.color,life:w.kind==='rocket'?1.5:1.6,r:w.kind==='rocket'?6:3,rocket:w.kind==='rocket',blast,splash:.48+rank*.035});
 }
 particles.push({x:sx,y:sy,life:.16,max:.16,color:w.color,kind:'muzzle',r:12});
 if(w.kind==='rocket')particles.push({x:sx-6,y:sy,life:.35,max:.35,color:'#ffb36c',kind:'smoke'});

 rr(18,420,164,100,14,'rgba(5,13,22,.91)','#40576b');txt('DI CHUYỂN',100,433,9,C.muted,800,'center');
 button('left',28,443,68,66,'◀',()=>{}, {fill:'#253d53',stroke:'#658098',size:27});addHoldHit('leftHold',28,443,68,66,{move:-1});
 button('right',104,443,68,66,'▶',()=>{}, {fill:'#253d53',stroke:'#658098',size:27});addHoldHit('rightHold',104,443,68,66,{move:1});
 rr(778,427,160,86,17,'#5b2d2d','#ff8a75',2);txt('GIỮ ĐỂ BẮN',858,444,10,'#ffd9c4',900,'center');txt('FIRE',858,477,23,'#fff2df',1000,'center');addHoldHit('fireHold',778,427,160,86,{fire:true});
 if(noticeTimer>0){rr(330,160,300,36,10,'rgba(9,22,34,.9)',C.cyan);txt(notice,480,178,12,C.cyan,800,'center');}
}

function drawPaused(){drawPlaying();ui=[];rr(0,0,W,H,'rgba(2,7,13,.7)');rr(330,150,300,240,20,'#122337','#597389',1.5);txt('TẠM DỪNG',480,192,25,C.text,900,'center');txt('Đoàn xe đang chờ lệnh của bạn',480,225,12,C.muted,600,'center');button('resume',370,253,220,45,'▶ TIẾP TỤC',()=>mode='playing',{fill:'#2d6048',stroke:C.green,size:14});button('pauseGarage',370,309,220,40,'VỀ XƯỞNG',()=>{mode='garage';},{fill:'#263d52',size:13});button('quit',370,358,220,28,'RỜI ẢI',()=>{mode='levels';},{fill:'#382d35',stroke:'#835b65',size:11});}
function drawResult(){drawBg(anim*.12);rr(235,55,490,430,22,'rgba(8,18,29,.96)','#526a7f',1.5);let won=resultStars>0;txt(won?'ẢI HOÀN THÀNH':'XE ĐÃ THẤT THỦ',480,100,27,won?C.green:C.red,1000,'center');txt(`${chapters[chapter].name} • ẢI ${level+1}: ${getMission().name}`,480,135,13,C.muted,600,'center');for(let i=0;i<3;i++)starShape(420+i*60,190,22,i<resultStars?C.gold:'#334554');txt(won?`${resultStars}/3 SAO`:'CHƯA ĐẠT SAO',480,232,17,C.gold,900,'center');txt(`Zombie tiêu diệt: ${kills}/${quota}`,480,271,14,C.text,700,'center');txt(`Máu xe còn: ${Math.ceil(player.hp)}/${player.maxHp}  •  Thời gian: ${Math.floor(elapsed)} giây`,480,298,12,C.muted,600,'center');txt(`+${stageReward} xu`,480,334,18,C.gold,900,'center');if(won&&resultStars)txt(`+${resultStars} ★ vào kho sao đổi xe`,480,354,10,C.gold,800,'center');txt('ĐIỀU KIỆN SAO',480,369,10,C.cyan,900,'center');txt('★ Hoàn thành ải   ★ Máu xe ≥55%   ★ Máu ≥78% và đúng hạn',480,390,10,C.text,600,'center');button('retry',270,427,130,42,'↻ CHƠI LẠI',()=>startMission(),{fill:'#36485a',size:12});button('garage',415,427,130,42,'XƯỞNG',()=>mode='garage',{fill:'#36485a',size:12});button('next',560,427,130,42,chapter===2&&level===9?'CHIẾN DỊCH':'ẢI TIẾP →',()=>{if(chapter===2&&level===9){mode='chapters';return;}let n=chapter*10+level+1;chapter=Math.floor(n/10);level=n%10;mode='garage';},{disabled:!won||chapter*10+level>=29,fill:'#315c48',stroke:C.green,size:11});}
function toast(s){notice=s;noticeTimer=1.5;}
function drawLootOverlay(){if(!lootModal&&!boxReveal)return;ui=[];rr(0,0,W,H,'rgba(1,5,10,.78)');let opening=!!boxReveal,phase=opening?Math.min(1,(anim-boxReveal.started)/.75):1;rr(245,55,470,430,22,'#122438','#d5a85f',2);txt(opening?'MỞ HỘP TIẾP TẾ':'BOSS ĐÃ BỊ HẠ!',480,94,25,C.gold,1000,'center');let pulse=.5+.5*Math.sin(anim*9);ctx.save();ctx.shadowColor='#ffc96b';ctx.shadowBlur=24*pulse;rr(427,122,106,82,16,'#76542c','#f5d28a',3);txt('▣',480,164,52,'#ffe7a5',1000,'center');ctx.restore();if(opening){txt(phase<1?'ĐANG MỞ KHÓA...':'PHẦN THƯỞNG',480,225,13,C.cyan,900,'center');txt(`+${boxReveal.coins} xu`,480,253,17,C.gold,900,'center');boxReveal.rewards.forEach((r,i)=>{let x=315+i*112;rr(x,282,102,92,12,'#1b3448','#5c7890',1.2);circle(x+51,311,17,weapons[r.wi].color);txt(weapons[r.wi].short,x+51,311,10,'#142230',900,'center');txt(weapons[r.wi].name,x+51,342,8,C.text,800,'center');txt('+'+r.frags+' MẢNH',x+51,360,10,C.gold,900,'center');});button('claimBox',350,415,260,44,phase<1?'ĐANG MỞ...':'ẤN ĐỂ NHẬN',()=>claimBox(),{disabled:phase<1,fill:'#315d47',stroke:C.green,size:14});}else{txt('Hộp thưởng của boss đã rơi xuống!',480,230,13,C.muted,700,'center');lootModal.rewards.forEach((r,i)=>{let x=315+i*112;rr(x,265,102,90,12,'#1b3448','#5c7890',1.2);circle(x+51,294,17,weapons[r.wi].color);txt(weapons[r.wi].short,x+51,294,10,'#142230',900,'center');txt(weapons[r.wi].name,x+51,325,8,C.text,800,'center');txt('+'+r.frags+' MẢNH',x+51,344,10,C.gold,900,'center');});txt(`+${lootModal.coins} xu`,480,382,16,C.gold,900,'center');button('takeBossLoot',350,423,125,42,'NHẬN HỘP',()=>{for(const r of lootModal.rewards)save.weaponFragments[r.wi]=(save.weaponFragments[r.wi]||0)+r.frags;save.boxes.elite=(save.boxes.elite||0)+1;lootModal=null;checkAchievements();store();toast('Đã nhận mảnh và 1 hộp cao cấp!');},{fill:'#315d47',stroke:C.green,size:11});button('skipBossLoot',485,423,125,42,'BỎ QUA',()=>{save.boxes.elite=(save.boxes.elite||0)+1;lootModal=null;store();toast('Đã cất 1 hộp cao cấp vào kho!');},{fill:'#35475a',size:11});}}
function draw(){ui=[];if(mode==='title')drawTitle();else if(mode==='roulette')drawRoulette();else if(mode==='zombieGuide')drawZombieGuide();else if(mode==='settings')drawSettings();else if(mode==='leaderboard')drawLeaderboard();else if(mode==='changelog')drawChangelog();else if(mode==='chapters')drawChapters();else if(mode==='levels')drawLevels();else if(mode==='garage')drawGarage();else if(mode==='vehicles')drawVehicles();else if(mode==='achievements')drawAchievements();else if(mode==='shop')drawShop();else if(mode==='upgrades')drawUpgrades();else if(mode==='playing')drawPlaying();else if(mode==='paused')drawPaused();else if(mode==='result')drawResult();if(lootModal||boxReveal)drawLootOverlay();}
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;anim+=dt;if(mode==='playing'&&!lootModal&&!boxReveal)updateGame(dt);if(mode==='roulette')updateRoulette();if(noticeTimer>0)noticeTimer-=dt;draw();requestAnimationFrame(frame)}
function pointerPos(e){let r=canvas.getBoundingClientRect(),u=(e.clientX-r.left)/r.width,v=(e.clientY-r.top)/r.height;let x,y;if(matchMedia('(orientation: portrait)').matches){ // canvas rotated 90deg clockwise in portrait
 x=v*W;y=(1-u)*H;
 }else{x=u*W;y=v*H;}return {x,y};}
function dispatch(x,y){for(let i=ui.length-1;i>=0;i--){let h=ui[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return true;}}return false;}
const pointerControls=new Map();let keyboardMove=0,keyboardFire=false;
function syncHeldControls(){let pointerMove=0,pointerFire=false;for(const control of pointerControls.values()){if(control.move)pointerMove=control.move;if(control.fire)pointerFire=true;}moveDir=pointerMove||keyboardMove;fireHeld=pointerFire||keyboardFire;}
function dispatch(x,y,pointerId){for(let i=ui.length-1;i>=0;i--){let h=ui[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){if(h.hold){pointerControls.set(pointerId,h.hold);syncHeldControls();}else if(h.fn)h.fn();return true;}}return false;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);let p=pointerPos(e);dispatch(p.x,p.y,e.pointerId);});
canvas.addEventListener('pointerup',e=>{pointerControls.delete(e.pointerId);syncHeldControls();});
canvas.addEventListener('pointercancel',e=>{pointerControls.delete(e.pointerId);syncHeldControls();});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')keyboardMove=-1;if(e.key==='ArrowRight'||e.key==='d')keyboardMove=1;if(e.key===' '||e.key==='Enter')keyboardFire=true;if(e.key==='Escape'&&mode==='playing'){mode='paused';keyboardFire=false;keyboardMove=0;pointerControls.clear();}if(e.key==='1'||e.key==='2'||e.key==='3')switchWeaponSlot(Number(e.key)-1);syncHeldControls();});
window.addEventListener('keyup',e=>{if(['ArrowLeft','a'].includes(e.key)&&keyboardMove===-1)keyboardMove=0;if(['ArrowRight','d'].includes(e.key)&&keyboardMove===1)keyboardMove=0;if(e.key===' '||e.key==='Enter')keyboardFire=false;syncHeldControls();});
// Clear each held input independently if focus is lost.
window.addEventListener('blur',()=>{pointerControls.clear();keyboardMove=0;keyboardFire=false;syncHeldControls();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pointerControls.clear();keyboardMove=0;keyboardFire=false;syncHeldControls();if(mode==='playing')mode='paused';}});
requestAnimationFrame(frame);
})();
</script>
